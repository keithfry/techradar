# This repo's AI/Robotics digest config — runs against the news-radar package.
#
# output_root is this repo's own techradar/. It is tracked in git (GitHub keeps
# the history) and the publish hook rsyncs it to https://keithfry.net/techradar/
# via deploy_techradar.sh. output_root maps directly to that path, so no
# public_path_prefix is needed.
#
# Consumed by run.py via `newsradar.cli.main()`. Secrets (GMAIL_CLIENT_ID/SECRET,
# ANTHROPIC_API_KEY) are NOT here — they load from ~/keys/kfopenclaw-gmail.env
# via run.py.

[site]
title = "AI + Robotics Techradar"
base_url = "https://keithfry.net/techradar"
author_name = "Keith Fry"
author_email = "keithfry@gmail.com"
# Match keithfry.net: digests link techradar/radar.css in place of their inline
# styles and get a bar linking back to the main site. generate-index.sh uses
# the same three bar values for the index pages.
stylesheet = "radar.css"
home_url = "https://keithfry.net/"
home_label = "Keith Fry"
section_label = "Tech Radar"

[models]
# Base/default models — any topic file in topics/ can override a subset of
# these in its own [models] table.
summarize_model = "ollama/gemma4:e2b"
rank_model = "ollama/qwen3.5:9b"
# Haiku, via the local `claude` CLI. On 2026-10-16's 104 AI items it gave the
# same correct groups across replays; nemotron-3-super:cloud varied from 1 to
# 5 drops and grouped unrelated stories.
dedup_model = "anthropic/claude-haiku-5-5"
# 0 = send all items in one dedup call.
dedup_batch_size = 0
ad_detector_model = "ollama/ad-detector"
ad_gate_enabled = true

[pipeline]
lookback_hours = 24
llm_workers = 2
url_workers = 10
article_body_char_cap = 20000
tts_workers = 4
arxiv_max_papers = 10

[gmail]
# Lives outside the repo, alongside the other secrets in ~/keys.
token_path = "/Users/keithfry/keys/kfopenclaw-email-token.json"

[paths]
# This config file lives in config/. output_root is this repo's techradar/
# (see note above).
output_root = "../techradar"

[publish]
hook = "hooks.publish:publish_hook"

# --- Topics -----------------------------------------------------------------
# Each topic (its keywords, classifier prompt, feed list) lives in its own
# file under topics/ — see config/topics/ai.toml, config/topics/robotics.toml
# and config/topics/research.toml.

[topics]
files = ["topics/ai.toml", "topics/research.toml", "topics/robotics.toml"]
